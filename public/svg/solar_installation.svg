<svg xmlns="http://www.w3.org/2000/svg" width="938" height="604" viewBox="0 0 938 604" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" artist="PACTE Renewable Energy" source="https://undraw.co/">
    <title>Installateur de systèmes solaires photovoltaïques - Énergies Renouvelables</title>
    <defs>
        <!-- Dégradé panneau solaire -->
        <linearGradient id="solarPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        
        <!-- Dégradé reflet verre solaire -->
        <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
            <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>

        <!-- Dégradé soleil éclatant -->
        <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fde047"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>

        <!-- Dégradé onde d'énergie -->
        <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
    </defs>

    <!-- 1. Carte de fond unDraw avec coins arrondis -->
    <rect x="28" y="24" width="882" height="556" rx="36" fill="#f4f5f9"/>

    <!-- 2. Soleil éclatant et rayons d'énergie -->
    <g id="sun-element">
        <circle cx="160" cy="120" r="54" fill="#fef08a" opacity="0.4"/>
        <circle cx="160" cy="120" r="42" fill="url(#sunGrad)"/>
        <!-- Rayons stylisés -->
        <line x1="160" y1="52" x2="160" y2="40" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <line x1="160" y1="188" x2="160" y2="200" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <line x1="92" y1="120" x2="80" y2="120" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <line x1="228" y1="120" x2="240" y2="120" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <line x1="112" y1="72" x2="103" y2="63" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <line x1="208" y1="168" x2="217" y2="177" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <line x1="112" y1="168" x2="103" y2="177" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <line x1="208" y1="72" x2="217" y2="63" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 3. Collines et horizon lointain (transition écologique) -->
    <path d="M28,490 Q220,440 440,470 T910,450 L910,580 L28,580 Z" fill="#e9ecf5"/>
    <path d="M28,520 Q300,480 600,505 T910,490 L910,580 L28,580 Z" fill="#dfe3ef"/>

    <!-- 4. Éoliennes stylisées en arrière-plan (mix énergétique renouvelable) -->
    <g id="wind-turbines" opacity="0.65">
        <!-- Éolienne 1 (principale lointaine) -->
        <line x1="770" y1="460" x2="770" y2="280" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
        <circle cx="770" cy="280" r="5" fill="#64748b"/>
        <!-- Pâles -->
        <line x1="770" y1="280" x2="770" y2="210" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="770" y1="280" x2="710" y2="315" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="770" y1="280" x2="830" y2="315" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Éolienne 2 (plus lointaine) -->
        <line x1="840" y1="470" x2="840" y2="330" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
        <circle cx="840" cy="330" r="3.5" fill="#94a3b8"/>
        <!-- Pâles -->
        <line x1="840" y1="330" x2="840" y2="280" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="840" y1="330" x2="795" y2="355" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="840" y1="330" x2="885" y2="355" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- 5. Châssis / Support métallique du panneau solaire -->
    <g id="solar-mount">
        <!-- Pieds arrières -->
        <line x1="530" y1="460" x2="520" y2="520" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <line x1="800" y1="410" x2="810" y2="500" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <line x1="520" y1="520" x2="810" y2="500" stroke="#475569" stroke-width="4"/>
        
        <!-- Jambes de force -->
        <line x1="520" y1="520" x2="620" y2="440" stroke="#64748b" stroke-width="4"/>
        <line x1="810" y1="500" x2="710" y2="430" stroke="#64748b" stroke-width="4"/>
        
        <!-- Socles de fixation au sol -->
        <rect x="508" y="516" width="24" height="8" rx="3" fill="#1e293b"/>
        <rect x="798" y="496" width="24" height="8" rx="3" fill="#1e293b"/>
    </g>

    <!-- 6. Panneau Solaire Photovoltaïque principal (Perspective inclinée) -->
    <g id="solar-panel">
        <!-- Cadre aluminium extérieur -->
        <polygon points="460,200 830,170 870,420 480,460" fill="#334155" stroke="#1e293b" stroke-width="3"/>
        
        <!-- Surface active des cellules photovoltaïques -->
        <polygon points="466,206 824,176 864,414 486,454" fill="url(#solarPanelGrad)"/>
        
        <!-- Grille de cellules solaires (Lignes de séparation blanches fines) -->
        <!-- Lignes horizontales -->
        <line x1="473" y1="268" x2="834" y2="236" stroke="#93c5fd" stroke-width="1.8" opacity="0.8"/>
        <line x1="479" y1="331" x2="844" y2="295" stroke="#93c5fd" stroke-width="1.8" opacity="0.8"/>
        <line x1="483" y1="393" x2="854" y2="355" stroke="#93c5fd" stroke-width="1.8" opacity="0.8"/>

        <!-- Lignes verticales -->
        <line x1="555" y1="198" x2="581" y2="444" stroke="#93c5fd" stroke-width="1.8" opacity="0.8"/>
        <line x1="645" y1="191" x2="675" y2="434" stroke="#93c5fd" stroke-width="1.8" opacity="0.8"/>
        <line x1="735" y1="183" x2="770" y2="424" stroke="#93c5fd" stroke-width="1.8" opacity="0.8"/>

        <!-- Reflet de lumière sur la surface de verre du panneau -->
        <polygon points="466,206 580,196 660,436 486,454" fill="url(#glassReflection)"/>
    </g>

    <!-- 7. Onduleur / Boîtier de raccordement électrique PACTE -->
    <g id="solar-inverter">
        <rect x="840" y="380" width="46" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
        <!-- Écran indicateur de puissance -->
        <rect x="848" y="392" width="30" height="18" rx="4" fill="#0f172a"/>
        <!-- Témoin LED verte (énergie active) -->
        <circle cx="856" cy="401" r="3" fill="#10b981"/>
        <line x1="863" y1="401" x2="872" y2="401" stroke="#38bdf8" stroke-width="2"/>
        <!-- Câble de raccordement solaire -->
        <path d="M840,430 Q800,450 780,480" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
        <path d="M840,436 Q790,460 760,500" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
        <!-- Symbole énergie verte sur l'onduleur -->
        <path d="M863,424 L859,434 L865,434 L861,446" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 8. Personnage : Installateur de systèmes solaires (Style unDraw) -->
    <g id="solar-technician">
        <!-- Jambe gauche & Pantalon de travail cargo -->
        <path d="M260,370 L250,490 L274,490 L288,380 Z" fill="#3f3d56"/>
        <!-- Jambe droite & Pantalon de travail cargo -->
        <path d="M295,370 L308,490 L332,490 L320,380 Z" fill="#2f2e41"/>
        
        <!-- Chaussures de sécurité professionnelles -->
        <path d="M234,490 L274,490 C274,490 278,506 268,510 L230,510 C224,506 226,494 234,490 Z" fill="#1e293b"/>
        <path d="M302,490 L342,490 C342,490 346,506 336,510 L298,510 C292,506 294,494 302,490 Z" fill="#1e293b"/>

        <!-- Ceinture porte-outils de l'installateur -->
        <rect x="254" y="360" width="70" height="12" rx="3" fill="#1e293b"/>
        <!-- Poches à outils -->
        <rect x="250" y="372" width="18" height="24" rx="4" fill="#64748b"/>
        <rect x="312" y="372" width="18" height="24" rx="4" fill="#64748b"/>
        <!-- Outil (tournevis isolé / pince) -->
        <path d="M256,366 L256,386" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

        <!-- Buste / T-shirt de travail aux couleurs PACTE -->
        <path d="M255,250 C240,265 242,360 255,365 L325,365 C338,360 340,265 325,250 Z" fill="#6c63ff"/>
        <!-- Gilet technique / bretelles d'équipement -->
        <path d="M270,250 L276,365 L290,365 L284,250 Z" fill="#5b21b6" opacity="0.6"/>
        <path d="M310,250 L304,365 L290,365 L296,250 Z" fill="#5b21b6" opacity="0.6"/>
        <!-- Bande rétro-réfléchissante sécurité -->
        <line x1="258" y1="320" x2="322" y2="320" stroke="#fef08a" stroke-width="4" opacity="0.9"/>

        <!-- Bras gauche tenant le multimètre / tablette de diagnostic -->
        <path d="M255,260 L220,310 L250,335 L270,300 Z" fill="#575a89"/>
        <!-- Main gauche (ton de peau unDraw) -->
        <circle cx="218" cy="318" r="10" fill="#ffb9b9"/>
        <!-- Multimètre solaire / Tablette de contrôle -->
        <rect x="195" y="300" width="30" height="42" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <rect x="200" y="306" width="20" height="18" rx="2" fill="#0f172a"/>
        <!-- Courbe de production photovoltaïque sur l'écran -->
        <path d="M202,320 Q210,310 218,312" fill="none" stroke="#10b981" stroke-width="2"/>
        <circle cx="210" cy="334" r="3" fill="#38bdf8"/>

        <!-- Bras droit orienté vers le panneau solaire (action d'installation) -->
        <path d="M325,260 L380,265 L415,245 L410,230 L370,248 L320,245 Z" fill="#6c63ff"/>
        <!-- Main droite -->
        <circle cx="418" cy="240" r="9" fill="#ffb9b9"/>
        <!-- Tournevis d'électricien dans la main -->
        <rect x="418" y="232" width="22" height="5" rx="1.5" fill="#e2e8f0" transform="rotate(-15 418 232)"/>
        <rect x="412" y="231" width="10" height="7" rx="2" fill="#f59e0b" transform="rotate(-15 412 231)"/>

        <!-- Cou -->
        <rect x="282" y="235" width="16" height="20" fill="#ffb9b9"/>

        <!-- Tête & Visage de profil tourné vers le panneau solaire -->
        <circle cx="294" cy="215" r="24" fill="#ffb9b9"/>
        <!-- Nez & profil unDraw -->
        <path d="M312,212 L320,217 L312,223 Z" fill="#ffb9b9"/>
        <!-- Cheveux style unDraw moderne -->
        <path d="M272,216 C270,195 285,188 304,188 C318,188 322,198 320,210 C312,204 300,204 290,208 C280,212 276,216 272,216 Z" fill="#2f2e41"/>
        <ellipse cx="276" cy="218" rx="8" ry="14" fill="#2f2e41"/>

        <!-- Casque de protection chantier / solaire (Obligatoire pour installateur) -->
        <path d="M274,198 C276,172 318,172 328,198 Z" fill="#f59e0b"/>
        <!-- Visière du casque -->
        <path d="M270,198 L334,198 C338,198 338,203 334,203 L270,203 Z" fill="#d97706"/>
    </g>

    <!-- 9. Badge flottant d'énergie verte (100% Renouvelable) -->
    <g id="clean-energy-badge" transform="translate(100, 390)">
        <circle cx="30" cy="30" r="28" fill="#ffffff" filter="drop-shadow(0 8px 16px rgba(16,185,129,0.15))"/>
        <circle cx="30" cy="30" r="22" fill="#ecfdf5"/>
        <!-- Feuille / Éclair vert éco-responsable -->
        <path d="M30,16 C22,22 22,34 30,42 C38,34 38,22 30,16 Z" fill="#10b981"/>
        <path d="M30,22 L30,36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- 10. Ondes d'énergie solaire transmise (particules de lumière) -->
    <circle cx="440" cy="180" r="4" fill="#fbbf24" opacity="0.7"/>
    <circle cx="480" cy="150" r="6" fill="#60a5fa" opacity="0.6"/>
    <circle cx="530" cy="120" r="5" fill="#34d399" opacity="0.6"/>
</svg>
