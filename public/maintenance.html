<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="120">
<title>Site en maintenance - DAIKIN CeFA-FC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    text-align: center;
    background: #1e293b;
    border-radius: 16px;
    padding: 48px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 12px;
    color: #ffffff;
  }
  p {
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .badge {
    display: inline-block;
    margin-top: 24px;
    padding: 6px 16px;
    background: #334155;
    border-radius: 999px;
    font-size: 13px;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>Site temporairement en maintenance</h1>
    <p>Nous effectuons actuellement des mises à jour sur la plateforme de recrutement DAIKIN.</p>
    <p>Le site sera de nouveau accessible très prochainement. Merci de votre patience.</p>
    <div class="badge">Cette page se recharge automatiquement</div>
  </div>
</body>
</html>
